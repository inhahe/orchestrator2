<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3242"/>
      <stop offset="1" stop-color="#1a1f2b"/>
    </linearGradient>
  </defs>
  <!-- rack chassis -->
  <rect x="10" y="6" width="44" height="52" rx="6" fill="url(#bg)" stroke="#3d4759" stroke-width="2"/>
  <!-- rack units -->
  <g>
    <rect x="16" y="12" width="32" height="10" rx="2" fill="#232a38"/>
    <rect x="16" y="27" width="32" height="10" rx="2" fill="#232a38"/>
    <rect x="16" y="42" width="32" height="10" rx="2" fill="#232a38"/>
  </g>
  <!-- vent slots -->
  <g fill="#4a5468">
    <rect x="20" y="15" width="14" height="1.6" rx="0.8"/>
    <rect x="20" y="18" width="14" height="1.6" rx="0.8"/>
    <rect x="20" y="30" width="14" height="1.6" rx="0.8"/>
    <rect x="20" y="33" width="14" height="1.6" rx="0.8"/>
    <rect x="20" y="45" width="14" height="1.6" rx="0.8"/>
    <rect x="20" y="48" width="14" height="1.6" rx="0.8"/>
  </g>
  <!-- status LEDs -->
  <circle cx="43" cy="17" r="2.2" fill="#38d17a"/>
  <circle cx="43" cy="32" r="2.2" fill="#4aa3ff"/>
  <circle cx="43" cy="47" r="2.2" fill="#f5c451"/>
</svg>
